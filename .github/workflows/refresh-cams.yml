name: Refresh St. Augustine cams

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cams
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live streams
        run: node update-cams.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name  "cam-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cams.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh live cams"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push failed, retrying in 5s..."
            sleep 5
          done
          exit 1
